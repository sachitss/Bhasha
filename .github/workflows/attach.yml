name: Attach signed APK
on: { push: { branches: [apk-upload] } }
permissions: { contents: write }
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload v1.3.0 Bhasha-1.3.0-signed.apk --clobber --repo "$GITHUB_REPOSITORY"
