name: Voice discovery (Piper)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  pitch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q piper-tts numpy
      - run: python -m piper.download_voices --download-dir v ne_NP-google-medium ne_NP-chitwan-medium de_DE-thorsten-high de_DE-kerstin-low en_GB-cori-high en_GB-alan-medium
      - run: |
          python3 - <<'PY'
          import wave, io, json, numpy as np
          from piper import PiperVoice
          from piper.config import SynthesisConfig
          def f0(path):
              w=wave.open(path); sr=w.getframerate(); x=np.frombuffer(w.readframes(w.getnframes()),dtype=np.int16).astype(float)/32768
              fr=int(sr*0.04); hop=int(sr*0.01); vals=[]
              for i in range(0,len(x)-fr,hop):
                  s=x[i:i+fr]; 
                  if np.sqrt((s**2).mean())<0.02: continue
                  s=s-s.mean(); ac=np.correlate(s,s,'full')[fr-1:]
                  lo,hi=int(sr/400),int(sr/70); k=lo+np.argmax(ac[lo:hi])
                  if ac[k]>0.3*ac[0]: vals.append(sr/k)
              return float(np.median(vals)) if vals else 0
          tests={"ne_NP-google-medium":"नमस्ते, तपाईंलाई कस्तो छ? म नेपाली सिक्दैछु।","ne_NP-chitwan-medium":"नमस्ते, तपाईंलाई कस्तो छ? म नेपाली सिक्दैछु।",
                 "de_DE-thorsten-high":"Guten Morgen, wie geht es Ihnen?","de_DE-kerstin-low":"Guten Morgen, wie geht es Ihnen?",
                 "en_GB-cori-high":"Good morning, how are you?","en_GB-alan-medium":"Good morning, how are you?"}
          out=[]
          for name,text in tests.items():
              v=PiperVoice.load(f"v/{name}.onnx"); n=v.config.num_speakers
              ids=list((v.config.speaker_id_map or {}).items()) or [(None,None)]
              for label,sid in ids:
                  with wave.open("t.wav","wb") as w: v.synthesize_wav(text,w,syn_config=SynthesisConfig(speaker_id=sid))
                  hz=f0("t.wav"); out.append(f"{name}#{label}:{hz:.0f}Hz")
          print("::notice title=pitch::"+" | ".join(out))
          PY
