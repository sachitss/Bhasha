name: Generate native audio
# Creates native-speaker audio (Azure Neural TTS) for German, English and Nepali, female and male.
# Needs repository secrets AZURE_SPEECH_KEY and AZURE_SPEECH_REGION (e.g. westeurope).
on:
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate all files
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [web/js/content.js, scripts/generate-audio.mjs]
permissions:
  contents: write
concurrency: { group: audio, cancel-in-progress: false }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate audio
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then
            echo "::warning::AZURE_SPEECH_KEY is not set. Add it under Settings → Secrets and variables → Actions, then run this workflow again."
            exit 0
          fi
          node scripts/generate-audio.mjs ${{ inputs.force && '--force' || '' }}
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/audio
          if git diff --cached --quiet; then echo "No audio changes."; exit 0; fi
          git commit -m "Update native audio"
          git push
